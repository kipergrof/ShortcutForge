name: Release

# Fully automatic release. In GitHub: Actions › Release › Run workflow, pick the bump:
#   patch = bug fixes (1.0.0 → 1.0.1), minor = new features (1.0.1 → 1.1.0), major = breaking (→ 2.0.0)
# The workflow bumps <Version> in Directory.Build.props, writes the CHANGELOG entry from the
# commit messages since the last release, commits, tags, runs the tests, builds the single-file
# exe and publishes the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      # Optional: a classic GitHub token with public_repo scope, saved as the WINGET_TOKEN secret.
      # When set, each release also opens the winget-pkgs pull request that updates the package.
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history and tags for the changelog

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Bump version and write changelog
        id: version
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $root = (Get-Location).Path
          $props = Join-Path $root 'Directory.Build.props'
          $changelogPath = Join-Path $root 'CHANGELOG.md'
          $text = [IO.File]::ReadAllText($props, $utf8)
          $current = [version]([regex]::Match($text, '<Version>([^<]+)</Version>').Groups[1].Value)
          $next = switch ('${{ inputs.bump }}') {
            'major' { [version]::new($current.Major + 1, 0, 0) }
            'minor' { [version]::new($current.Major, $current.Minor + 1, 0) }
            default { [version]::new($current.Major, $current.Minor, $current.Build + 1) }
          }
          $version = "$($next.Major).$($next.Minor).$($next.Build)"
          if (git tag -l "v$version") { throw "Tag v$version already exists." }
          $text = $text -replace '<Version>[^<]+</Version>', "<Version>$version</Version>"
          [IO.File]::WriteAllText($props, $text, $utf8)

          # Changelog entry from the commit subjects since the previous release tag.
          $lastTag = git describe --tags --abbrev=0 2>$null
          $range = if ($lastTag) { "$lastTag..HEAD" } else { 'HEAD' }
          $subjects = git log $range --no-merges --format='%s' |
            Where-Object { $_ -and $_ -notmatch '^Release v\d' }
          if (-not $subjects) { $subjects = @('Maintenance release') }
          $bullets = ($subjects | ForEach-Object { "- $_" }) -join "`n"
          $dash = [char]0x2013
          $entry = "## [$version] $dash $(Get-Date -Format 'yyyy-MM-dd')`n`n$bullets"
          $marker = '<!-- releases -->'
          $changelog = [IO.File]::ReadAllText($changelogPath, $utf8).Replace($marker, "$marker`n`n$entry")
          [IO.File]::WriteAllText($changelogPath, $changelog, $utf8)

          [IO.File]::WriteAllText((Join-Path $root 'release-notes.md'), $bullets, $utf8)
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing $version (was $current)"

      - name: Test
        run: dotnet test -c Release

      - name: Commit, tag and push
        shell: pwsh
        run: |
          # Committed under the repository owner's public noreply identity.
          git config user.name "Krisztián Szilvágyi"
          git config user.email "25442201+kipergrof@users.noreply.github.com"
          git add Directory.Build.props CHANGELOG.md
          git commit -m "Release v${{ steps.version.outputs.version }}"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin HEAD:main "v${{ steps.version.outputs.version }}"

      - name: Build the single-file exe
        shell: pwsh
        run: |
          $v = '${{ steps.version.outputs.version }}'
          dotnet publish src/ShortcutForge.App -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -o publish
          Copy-Item publish/ShortcutForge.App.exe "ShortcutForge-$v-win-x64.exe"

      - name: Build the Microsoft Store package
        # Optional: a problem with the Store package must not block the GitHub release.
        continue-on-error: true
        shell: pwsh
        run: ./packaging/msix/build-msix.ps1 -Output "ShortcutForge-${{ steps.version.outputs.version }}-store.msix"

      # Unsigned (the Store signs it on upload), so it is not attached to the release:
      # download it from the workflow run and upload it in Partner Center.
      - name: Keep the Store package as a workflow artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: store-msix
          path: ShortcutForge-${{ steps.version.outputs.version }}-store.msix

      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = "ShortcutForge $v by **Krisztián Szilvágyi** ([@kipergrof](https://github.com/kipergrof)).`n`n" + (Get-Content release-notes.md -Raw) +"`n`n**Download:** ShortcutForge-$v-win-x64.exe runs on Windows 10/11 x64 without installing .NET. SmartScreen may warn because the file is not code-signed (More info › Run anyway)."
          gh release create "v$v" "ShortcutForge-$v-win-x64.exe" --title "ShortcutForge $v" --notes $notes

      - name: Update the winget package
        if: env.WINGET_TOKEN != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          # wingetcreate update only works once the package is in the winget catalog.
          gh api repos/microsoft/winget-pkgs/contents/manifests/k/kipergrof/ShortcutForge --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "kipergrof.ShortcutForge is not in winget-pkgs yet; skipping the winget update."
            exit 0
          }
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          ./wingetcreate.exe update kipergrof.ShortcutForge --version $v `
            --urls "https://github.com/kipergrof/ShortcutForge/releases/download/v$v/ShortcutForge-$v-win-x64.exe" `
            --submit --token $env:WINGET_TOKEN
