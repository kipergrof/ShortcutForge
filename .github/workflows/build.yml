name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Libraries target .NET 8, the WPF app .NET 10; tests run on both runtimes.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  # macOS / Linux: the net8.0 libraries, the Avalonia desktop app and their tests.
  # The WPF app (ShortcutForge.App) only builds on Windows, so the solution is not built here.
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build desktop app
        run: dotnet build src/ShortcutForge.Desktop -c Release

      - name: Test
        run: |
          for project in tests/ShortcutForge.Core.Tests tests/ShortcutForge.Dsl.Tests tests/ShortcutForge.Editor.Tests; do
            dotnet test "$project" -c Release --logger "trx;LogFilePrefix=results" --results-directory TestResults || exit 1
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
